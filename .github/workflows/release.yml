name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のv始まりのタグ（例: v0.1.0）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Verify
        run: deno task verify

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
            extension: dmg
          - runner: macos-14
            target: x86_64-apple-darwin
            suffix: macos-x64
            extension: dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            extension: msi
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            extension: AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Build
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: >-
          deno task release:build
          --target "${{ matrix.target }}"
          --output "dist/KakomiCode-${RELEASE_TAG}-${{ matrix.suffix }}.${{ matrix.extension }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KakomiCode-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "囲みコード $RELEASE_TAG"

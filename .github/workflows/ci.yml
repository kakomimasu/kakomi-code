name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DENO_DIR: .deno-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: .deno-cache
          key: ${{ runner.os }}-${{ runner.arch }}-deno-v2-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-deno-v2-
      - name: Verify desktop
        run: deno task verify:desktop

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check website
        run: deno task check
        working-directory: website
      - name: Build website
        run: deno task build
        working-directory: website
